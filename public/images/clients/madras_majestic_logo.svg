<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <rect width="280" height="80" rx="12" fill="#18181b"/>
  <!-- Red oval emblem with 3 pillars arch -->
  <g transform="translate(18, 16)">
    <ellipse cx="24" cy="24" rx="22" ry="18" fill="#e11d48"/>
    <!-- 3 white pillars / arch -->
    <rect x="14" y="15" width="4" height="18" rx="2" fill="#ffffff"/>
    <rect x="22" y="12" width="4" height="21" rx="2" fill="#ffffff"/>
    <rect x="30" y="15" width="4" height="18" rx="2" fill="#ffffff"/>
    <path d="M14 17 Q24 9 34 17" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Text MAJESTIC 1963 -->
  <text x="75" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" fill="#e11d48" letter-spacing="1.5">MAJESTIC</text>
  <text x="210" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff" letter-spacing="1">1963</text>
  <text x="76" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#a1a1aa" letter-spacing="1">PALAYAM • TRIVANDRUM</text>
