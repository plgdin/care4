<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <!-- Contrail gradient -->
    <linearGradient id="contrailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#cfd8dc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#90a4ae" stop-opacity="0.5" />
    </linearGradient>
    
    <!-- USK pill gradient -->
    <linearGradient id="uskPillGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbc02d" />
      <stop offset="26%" stop-color="#7cb342" />
      <stop offset="35%" stop-color="#008ecc" />
      <stop offset="100%" stop-color="#008ecc" />
    </linearGradient>
  </defs>

  <!-- Left: Plate & Dining Utensils Emblem (centered at x=75, y=70) -->
  <g transform="translate(10, 0)">
    <!-- Fork on Left -->
    <g fill="#212121">
      <!-- 4 Tines -->
      <rect x="14" y="24" width="2" height="24" rx="1" />
      <rect x="18" y="24" width="2" height="24" rx="1" />
      <rect x="22" y="24" width="2" height="24" rx="1" />
      <rect x="26" y="24" width="2" height="24" rx="1" />
      <!-- Base of tines -->
      <path d="M 13,44 C 13,54 20,58 20,64 L 20,105 C 20,110 18,114 21,116 C 24,114 22,110 22,105 L 22,64 C 22,58 29,54 29,44 Z" />
    </g>

    <!-- Plate Rim (Outer Blue Ring) -->
    <circle cx="80" cy="70" r="50" fill="#ccebfb" stroke="#008ecc" stroke-width="8" />
    <!-- Plate Inner Ring -->
    <circle cx="80" cy="70" r="34" fill="#ffffff" stroke="#00a0e9" stroke-width="2.5" />

    <!-- Jet Contrail (Swirling arc from jet tail looping out of plate) -->
    <path d="M 75,75 C 65,95 62,115 74,132 C 78,137 72,138 67,133 C 54,115 57,90 73,73 Z" fill="url(#contrailGrad)" />
    <path d="M 74,75 C 66,95 64,115 73,130" fill="none" stroke="#b0bec5" stroke-width="2" stroke-linecap="round" />

    <!-- Jet Airplane Silhouette flying towards top-right -->
    <g transform="translate(82, 68) rotate(45)">
      <!-- Fuselage -->
      <path d="M 0,-24 C 2.5,-18 3,-5 3,18 C 3,21 1.5,23 0,23 C -1.5,23 -3,21 -3,18 C -3,-5 -2.5,-18 0,-24 Z" fill="#008ecc" />
      <!-- Nose highlight -->
      <path d="M 0,-24 L 2,-16 L -2,-16 Z" fill="#0077b6" />
      <!-- Wings -->
      <path d="M 0,-4 L 22,10 L 22,14 L 0,6 L -22,14 L -22,10 Z" fill="#008ecc" />
      <!-- Tailplane -->
      <path d="M 0,16 L 10,22 L 10,24 L 0,21 L -10,24 L -10,22 Z" fill="#008ecc" />
      <!-- Jet Engine pods -->
      <rect x="7" y="6" width="3" height="6" rx="1.5" fill="#006994" />
      <rect x="-10" y="6" width="3" height="6" rx="1.5" fill="#006994" />
    </g>

    <!-- Knife on Right -->
    <path d="M 132,24 C 137,28 141,40 141,60 C 141,70 137,76 137,105 C 137,112 138,116 135,116 C 132,116 133,112 133,105 L 133,24 Z" fill="#212121" />
  </g>

  <!-- Right: Typography & Brand Badging -->
  <g transform="translate(165, 0)">
    <!-- Primary Heading: UDAY SKY KITCHEN in Classical Serif Small Caps -->
    <g fill="#1a1a1a" font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', 'Times New Roman', serif" font-weight="700">
      <!-- U -->
      <text x="0" y="52" font-size="38">U</text>
      <!-- DAY -->
      <text x="32" y="52" font-size="28" letter-spacing="2">DAY</text>
      <!-- S -->
      <text x="110" y="52" font-size="38">S</text>
      <!-- KY -->
      <text x="135" y="52" font-size="28" letter-spacing="2">KY</text>
      <!-- K -->
      <text x="195" y="52" font-size="38">K</text>
      <!-- ITCHEN -->
      <text x="226" y="52" font-size="28" letter-spacing="2">ITCHEN</text>
    </g>

    <!-- Tagline: "Adding taste to the sky" in stylish italic cursive -->
    <text x="175" y="80" 
          text-anchor="middle" 
          fill="#009fe3" 
          font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', 'Segoe UI', cursive, sans-serif" 
          font-style="italic" 
          font-size="22" 
          letter-spacing="0.8">
      Adding taste to the sky
    </text>

    <!-- USK Oval Badge -->
    <g transform="translate(175, 108)">
      <!-- Pill base -->
      <ellipse cx="0" cy="0" rx="60" ry="17" fill="url(#uskPillGrad)" />
      
      <!-- Butterfly / Floral Wing icon on left side of badge -->
      <g transform="translate(-32, -1) scale(0.7)" fill="#8bc34a" stroke="#ffffff" stroke-width="0.8">
        <path d="M 0,0 C -8,-12 -16,-6 -10,0 C -18,4 -10,12 0,2 Z" />
        <path d="M 0,0 C 8,-12 16,-6 10,0 C 18,4 10,12 0,2 Z" />
        <circle cx="0" cy="0" r="1.5" fill="#fbc02d" />
      </g>
      
      <!-- USK Text in Badge -->
      <text x="8" y="6" 
            text-anchor="middle" 
            fill="#ffffff" 
            font-family="'Arial Black', 'Montserrat', 'Impact', sans-serif" 
            font-weight="900" 
            font-size="18" 
            letter-spacing="2">
        USK
      </text>
    </g>
  </g>
</svg>
